<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#FBFAF8;--ink:#1B1B1F;--mute:#6E6E78;--line:#DAD8D2;--acc:#E8334F;--field:#fff;--blue:#22B455;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151518;--ink:#F3F2EE;--mute:#9A9AA5;--line:#33333A;--field:#1E1E23}}
:root[data-theme="dark"]{--bg:#151518;--ink:#F3F2EE;--mute:#9A9AA5;--line:#33333A;--field:#1E1E23}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:48px 24px 32px}
h1{font-size:34px;line-height:1.1;font-weight:800;margin:0 0 12px;letter-spacing:-.02em}
p{color:var(--mute);margin:0 0 32px;line-height:1.5}
.row{display:flex;align-items:center;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:0 16px;height:60px}
.row:focus-within{border-color:var(--acc)}
.row.bad{border-color:var(--acc)}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:20px;font-weight:600;outline:none}
button{margin-top:20px;width:100%;height:56px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.ghost{background:var(--line);color:var(--ink);height:44px;font-size:15px;margin-top:16px}
.err{color:var(--acc);font-size:14px;font-weight:600;margin-top:10px;min-height:20px}
.nm{display:flex;align-items:center;gap:6px}
.vb{width:22px;height:22px;flex:none}
.top{display:flex;align-items:center;gap:6px;font-weight:800;font-size:22px;margin-bottom:20px}
.head{display:flex;align-items:center;gap:20px;margin-bottom:14px}
.av{width:86px;height:86px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:36px;flex:none}
.pst{flex:1;display:flex;justify-content:space-around;text-align:center;font-size:14px}
.pst b{display:block;font-size:20px}
.empty{padding:56px 0;text-align:center;color:var(--mute);border-top:1px solid var(--line);margin-top:20px}
.pr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pr .av{width:44px;height:44px;font-size:18px}
.pr .nm{flex:1;min-width:0;font-weight:700}
.pr .nm span{overflow:hidden;text-overflow:ellipsis}
.sm{margin:0;width:auto;height:36px;padding:0 12px;font-size:13px;border-radius:10px;white-space:nowrap}
.sm.on{background:none;color:var(--ink);border:1.5px solid var(--line)}
.x{background:none;color:var(--mute);font-size:22px;padding:0 6px;height:36px;width:auto;margin:0}
.hint{color:var(--mute);margin:20px 0 4px;font-size:14px;font-weight:600}
.pre{font-weight:600;padding-right:12px;margin-right:12px;border-right:1.5px solid var(--line)}
.mute{color:var(--mute);font-size:13px;margin-top:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="g">
    <h1>Admin paroli</h1>
    <p>Davom etish uchun parolni kiriting.</p>
    <div class="row" id="r"><input id="n" type="password" autocomplete="off" placeholder="Admin paroli" aria-label="Admin paroli"></div>
    <div class="err" id="e" role="alert"></div>
    <button id="go" disabled>Kirish</button>
  </section>

  <section id="p" hidden>
    <div class="top"><span>alibek</span><svg class="vb" viewBox="0 0 24 24" aria-label="Tasdiqlangan"><rect x="4" y="4" width="16" height="16" rx="4" fill="#22B455"/><rect x="4" y="4" width="16" height="16" rx="4" fill="#22B455" transform="rotate(45 12 12)"/><path d="M8 12.3l2.7 2.7L16.3 9.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <p style="margin-bottom:16px">Telefon raqam bo'yicha profilni toping yoki profil qo'shing va unga galochka qo'ying.</p>
    <div class="row"><span class="pre">+998</span><input id="tel" type="tel" inputmode="numeric" autocomplete="off" placeholder="90 123 45 67" aria-label="Telefon raqam"></div>
    <div id="res"></div>
    <div class="hint">Profil qo'shish</div>
    <div class="row"><input id="u" type="text" autocomplete="off" autocapitalize="none" maxlength="30" placeholder="Foydalanuvchi nomi" aria-label="Foydalanuvchi nomi"></div>
    <button id="add" disabled>Profil qo'shish</button>
    <div class="hint" id="hn" hidden>Profillar</div>
    <div id="list"></div>
    <div class="hint" id="chn" hidden>Qo'ng'iroq so'rovlari</div>
    <div id="clist"></div>
    <button class="ghost" id="out">Chiqish</button>
  </section>
</main>
<script>
var $=function(i){return document.getElementById(i)},n=$('n'),u=$('u'),BADGE='<svg class="vb" viewBox="0 0 24 24" aria-label="Tasdiqlangan"><rect x="4" y="4" width="16" height="16" rx="4" fill="#22B455"/><rect x="4" y="4" width="16" height="16" rx="4" fill="#22B455" transform="rotate(45 12 12)"/><path d="M8 12.3l2.7 2.7L16.3 9.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var KEY='ilova2:profiles',list=[];
try{list=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}srvPush(list)}
function draw(){
  var l=$('list');l.innerHTML='';$('hn').hidden=!list.length;
  list.forEach(function(p,i){
    var d=document.createElement('div');d.className='pr';
    d.innerHTML='<span class="av"></span><div class="nm"><span></span></div><button class="sm"></button><button class="x" aria-label="O\'chirish">&times;</button>';
    d.querySelector('.av').textContent=p.u[0].toUpperCase();
    var nm=d.querySelector('.nm');nm.querySelector('span').textContent=p.u;
    if(p.v){var t=document.createElement('span');t.innerHTML=BADGE;t.firstChild.style.cssText='width:16px;height:16px;margin-left:6px;vertical-align:-3px';nm.appendChild(t.firstChild)}
    var b=d.querySelector('.sm');b.textContent=p.v?'Galochkani olish':'Galochka qo\'yish';b.classList.toggle('on',p.v);
    b.onclick=function(){p.v=!p.v;save();draw()};
    d.querySelector('.x').onclick=function(){list.splice(i,1);save();draw()};
    l.appendChild(d)})}
n.addEventListener('input',function(){$('go').disabled=!n.value.trim();$('e').textContent='';$('r').classList.remove('bad')});
function authH(){return {Authorization:'Bearer '+TOK}}
function loadC(){if(!TOK||$('p').hidden)return;fetch('/api/contacts',{headers:authH()}).then(function(r){return r.json()}).then(function(c){if(!Array.isArray(c))return;var L=$('clist');L.innerHTML='';$('chn').hidden=!c.length;
  c.forEach(function(x){var d=document.createElement('div');d.className='pr';
    d.innerHTML='<div class="nm"><a style="color:inherit;text-decoration:none"></a><small style="display:block;color:var(--mute);font-weight:400"></small></div><button class="x" aria-label="O\'chirish">&times;</button>';
    var al=d.querySelector('a');al.textContent='+998 '+fmt(x.phone);al.href='tel:+998'+x.phone;
    d.querySelector('small').textContent=(x.user?'@'+x.user+' \u00b7 ':'')+new Date(x.ts).toLocaleString();
    d.querySelector('.x').onclick=function(){fetch('/api/contacts/'+x.id,{method:'DELETE',headers:authH()}).then(loadC)};
    L.appendChild(d)})}).catch(function(){})}
setInterval(loadC,20000);
function enter(){adminLogin(n.value,function(ok){if(ok){$('g').hidden=true;$('p').hidden=false;srvPull(function(a){if(a){list=a}draw();loadC();restoreTel()})}else{$('e').textContent="Parol noto'g'ri.";$('r').classList.add('bad')}})}
$('go').onclick=enter;
n.addEventListener('keydown',function(e){if(e.key==='Enter'&&n.value.trim())enter()});
function norm(){return u.value.trim().toLowerCase().replace(/[^a-z0-9._]/g,'')}
u.addEventListener('input',function(){$('add').disabled=!norm()});
function add(){var x=norm();if(!x)return;
  if(!list.some(function(p){return p.u===x}))list.unshift({u:x,v:false});
  u.value='';$('add').disabled=true;save();draw()}
$('add').onclick=add;
u.addEventListener('keydown',function(e){if(e.key==='Enter')add()});
function fmt(d){return [d.slice(0,2),d.slice(2,5),d.slice(5,7),d.slice(7,9)].filter(Boolean).join(' ')}
function lookup(d,sm){
  var a=null,m=null;try{a=JSON.parse(localStorage.getItem('ilova:acct:'+d));m=JSON.parse(localStorage.getItem('ilova:'+d))}catch(e){}
  if(!a&&!(m&&m.me)&&sm)m=sm;
  var r=$('res');r.innerHTML='';
  function nf(){var x=document.createElement('div');x.className='err';x.textContent='Bu raqam bilan profil topilmadi.';r.appendChild(x)}
  if(!a&&!(m&&m.me)){
    if(!sm&&TOK)fetch('/api/account/'+d,{headers:authH()}).then(function(x){return x.ok?x.json():null}).then(function(j){if(j&&j.u)lookup(d,{me:{u:j.u,n:j.n||''}});else nf()}).catch(nf);else nf();
    return}
  var u=(m&&m.me&&m.me.u)||'alibek';if(u==='siz')u='alibek';var full=a?(a.n+' '+a.f):((m&&m.me&&m.me.n)||''),cur=null;
  list.forEach(function(p){if(p.u===u)cur=p});
  var d2=document.createElement('div');d2.className='pr';
  d2.innerHTML='<span class="av"></span><div style="flex:1;min-width:0"><div class="rn" style="font-weight:700"></div><div class="mute"></div></div><button class="sm"></button>';
  d2.querySelector('.av').textContent=(full||u)[0].toUpperCase();
  var rn=d2.querySelector('.rn');rn.textContent=full||u;
  if(cur&&cur.v){var t=document.createElement('span');t.innerHTML=BADGE;t.firstChild.style.cssText='width:16px;height:16px;margin-left:6px;vertical-align:-3px';rn.appendChild(t.firstChild)}
  d2.querySelector('.mute').textContent='@'+u+' \u00b7 +998 '+fmt(d);
  var b=d2.querySelector('.sm'),on=!!(cur&&cur.v);b.textContent=on?'Galochkani olish':"Galochka qo'yish";b.classList.toggle('on',on);
  b.onclick=function(){if(!cur){cur={u:u,v:true};list.unshift(cur)}else cur.v=!cur.v;save();draw();lookup(d)};
  r.appendChild(d2)}
$('tel').addEventListener('input',function(){var d=this.value.replace(/\D/g,'').slice(0,9);this.value=fmt(d);if(d.length===9){try{localStorage.setItem('adm:ph',d)}catch(e){}lookup(d)}else $('res').innerHTML=''});
function restoreTel(){var d='';try{d=localStorage.getItem('adm:ph')||''}catch(e){}if(/^\d{9}$/.test(d)&&!$('tel').value){$('tel').value=fmt(d);lookup(d)}}

/* ===== Umumiy server (Firebase Realtime Database) ===== */
var TOK='';try{TOK=sessionStorage.getItem('adm:tok')||''}catch(e){}
function srvOn(){return true}
function adminLogin(pw,cb){fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(function(r){return r.json().then(function(d){if(r.ok&&d.token){TOK=d.token;try{sessionStorage.setItem('adm:tok',TOK)}catch(e){}cb(true)}else cb(false)})}).catch(function(){cb(false)})}
function srvPull(cb){
  fetch('/api/profiles',{headers:TOK?{Authorization:'Bearer '+TOK}:{}}).then(function(r){return r.json()}).then(function(arr){
    if(!Array.isArray(arr)){cb&&cb();return}
    try{localStorage.setItem('ilova2:profiles',JSON.stringify(arr))}catch(e){}
    cb&&cb(arr)}).catch(function(){cb&&cb()})}
function srvPush(arr){
  if(!TOK)return;
  fetch('/api/profiles',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOK},body:JSON.stringify(arr)}).then(function(r){if(r.status===401){TOK='';try{sessionStorage.removeItem('adm:tok')}catch(e){}alert('Admin sessiyasi tugadi. Qayta kiring.')}}).catch(function(){})}
srvPull(function(arr){if(arr){list=arr;if(!$('p').hidden)draw()}});
$('out').onclick=function(){TOK='';try{sessionStorage.removeItem('adm:tok')}catch(e){}n.value='';$('go').disabled=true;$('p').hidden=true;$('g').hidden=false;n.focus()};
</script>
</body>
</html>
